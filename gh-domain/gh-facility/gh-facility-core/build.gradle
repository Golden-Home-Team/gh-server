dependencies {

    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:general"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"

    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    testImplementation 'com.h2database:h2'

    implementation(project(":gh-common"))
}

jar.enabled = true

// Q-Class가 생성될 디렉토리
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

// Q-Class 디렉토리를 소스 디렉토리에 추가하여 컴파일러가 인식하도록 함
sourceSets {
    main.java.srcDir querydslDir
}
// Gradle 8.x 이상에서 QueryDSL 컴파일 에러가 발생할 경우 아래 설정 추가 (Deprecated된 옵션 사용 시)
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(file(querydslDir))
}