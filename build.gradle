                'community-notice-write': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-notice-write',
                'community-notice-update': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-notice-update',
                'community-notice-readAll': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-notice-readAll',
