                'community-inquiry-readAll': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-inquiry-readAll',
                'community-user-check': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-user-check',
                'community-read': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-read',
                'community-mine': 'gh-domain/gh-community/gh-community-api/build/generated-snippets/community-mine',
                'question-readAll': 'gh-domain/gh-question/gh-question-api/build/generated-snippets/question-readAll',
                'question-survey': 'gh-domain/gh-question/gh-question-api/build/generated-snippets/question-survey',
                'chat-enter': 'gh-domain/gh-chat/gh-chat-api/build/generated-snippets/chat-enter',
                'chat-get-rooms': 'gh-domain/gh-chat/gh-chat-api/build/generated-snippets/chat-get-rooms',
                'chat-get-messages': 'gh-domain/gh-chat/gh-chat-api/build/generated-snippets/chat-get-messages',
                'notice-write': 'gh-domain/gh-notice/gh-notice-api/build/generated-snippets/notice-write',
                'notice-readAll': 'gh-domain/gh-notice/gh-notice-api/build/generated-snippets/notice-readAll',
                'notice-read': 'gh-domain/gh-notice/gh-notice-api/build/generated-snippets/notice-read'



        sources {
            include '**/index.adoc'
        }

        dependsOn subprojects.test
    }

//    tasks.withType(JavaCompile).configureEach {
//        options.compilerArgs << "-parameters"
//    }


    bootJar.enabled = false
    jar.enabled = false
}



