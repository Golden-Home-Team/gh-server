dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-web'

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    testImplementation 'com.h2database:h2'

    implementation(project(":gh-common"))
    implementation(project(":gh-domain:gh-community:gh-community-core"))
    implementation(project(":gh-api-interface:gh-file-api-interface"))
    implementation(project(":gh-api-interface:gh-user-api-interface"))
    implementation(project(":gh-api-interface:gh-facility-api-interface"))


}

jar.enabled = true