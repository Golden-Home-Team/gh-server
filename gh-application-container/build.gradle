import org.asciidoctor.gradle.jvm.AsciidoctorTask

plugins {
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.0.0"
}

sentry {
    includeSourceContext = true
    org = "goldenhome"
    projectName = "goldenhome"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}


bootJar {
    enabled = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 루트 프로젝트의 asciidoctor 태스크를 참조합니다.
    // project(':')는 현재 서브 프로젝트에서 루트 프로젝트를 나타냅니다.
    def rootAsciidoctorTask = project(':').tasks.named('asciidoctor', AsciidoctorTask)

    // bootJar가 루트 프로젝트의 asciidoctor 태스크가 완료된 후에 실행되도록 의존성을 추가합니다.
    dependsOn rootAsciidoctorTask

    // 루트 프로젝트의 asciidoctor 출력 디렉토리에서 파일을 복사합니다.
    from(rootAsciidoctorTask.get().outputDir) {
        into 'static/docs' // Spring Boot 애플리케이션의 static/docs 경로로 복사
    }

}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf:4.0.0-RC1")

    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation(project(":gh-domain:gh-user:gh-user-api"))
    implementation(project(":gh-domain:gh-user:gh-user-internal-api"))
    implementation(project(":gh-domain:gh-user:gh-user-core"))

    implementation(project(":gh-domain:gh-facility:gh-facility-api"))
    implementation(project(":gh-domain:gh-facility:gh-facility-internal-api"))

    implementation(project(":gh-domain:gh-resume:gh-resume-api"))

    implementation(project(":gh-domain:gh-file:gh-file-api"))
    implementation(project(":gh-domain:gh-file:gh-file-internal-api"))

    implementation(project(":gh-domain:gh-review:gh-review-api"))
    implementation(project(":gh-domain:gh-review:gh-review-internal-api"))

    implementation(project(":gh-domain:gh-like:gh-like-api"))
    implementation(project(":gh-domain:gh-like:gh-like-internal-api"))

    implementation(project(":gh-domain:gh-view:gh-view-api"))
    implementation(project(":gh-domain:gh-view:gh-view-internal-api"))

    implementation(project(":gh-domain:gh-community:gh-community-api"))
    implementation(project(":gh-domain:gh-community:gh-community-internal-api"))
    implementation(project(":gh-domain:gh-community:gh-community-core"))

    implementation(project(":gh-domain:gh-question:gh-question-api"))

    implementation(project(":gh-domain:gh-chat:gh-chat-api"))
    implementation(project(":gh-domain:gh-chat:gh-chat-core"))

    implementation(project(":gh-domain:gh-notice:gh-notice-api"))

    implementation(project(":gh-domain:gh-terms:gh-terms-api"))

    implementation(project(":gh-event"))
    implementation(project(":gh-common"))
    implementation(project(":gh-social"))
    implementation(project(":gh-notification"))
    implementation(project(":gh-logging"))
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.68.Final:osx-aarch_64'
}

