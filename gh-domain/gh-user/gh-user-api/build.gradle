dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'net.nurigo:sdk:4.3.2'

    implementation "io.jsonwebtoken:jjwt-api:0.12.6"
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.6")

    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    testImplementation 'com.h2database:h2'
    testImplementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    testImplementation("com.google.firebase:firebase-admin:9.7.0")



    implementation(project(":gh-common"))
    implementation(project(":gh-api-interface:gh-file-api-interface"))
    implementation(project(":gh-domain:gh-user:gh-user-core"))
    implementation(project(":gh-social"))
    implementation(project(":gh-notification"))

}

jar.enabled = true
